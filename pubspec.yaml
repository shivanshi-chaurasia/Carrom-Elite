name: elite_finance
description: "Carrom + Lottery real-time multiplayer gaming app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.2
  pinput: ^6.0.2
  flutter_riverpod: ^3.0.3
  go_router: ^17.0.0
  dio: ^5.9.0
  hive: ^2.2.3
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.0.0-beta.4
  socket_io_client: ^3.1.2
  firebase_messaging: ^16.0.4
  flame: ^1.33.0
  flame_forge2d: ^0.19.2+5


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/
    - assets/icons/
    - assets/animations/
